name: Validar mobile 3.0

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos, lint e motores
        run: npm run check
      - name: Exportar interface web para QA
        run: npm run export:web
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Verificar fluxos e persistência
        run: npm run test:e2e
      - name: Guardar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-qa-${{ github.run_number }}
          path: |
            mobile/docs/e2e-results.json
            mobile/docs/v3-*.png
            mobile/test-results/
          if-no-files-found: warn
          retention-days: 14
